name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml; 3.12 is the ceiling the
        # pinned torch/scikit-learn wheels support.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The CPU wheel avoids pulling ~2GB of CUDA libraries that CI never uses.
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest ruff

      - name: Lint
        run: ruff check scripts tests

      - name: Test
        run: pytest -q

      - name: Verify the vision stack imports on 3.12
        # The pipeline modules are skipped by the lean test run; check them explicitly
        # on the newest supported interpreter so a PEP-604 regression cannot hide.
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install ultralytics opencv-python-headless kagglehub torchvision
          python -c "import scripts.run_full_pipeline, scripts.train_vae_pipeline, scripts.train_lstm_vae_pipeline"
          pytest -q tests/test_pipeline_wiring.py
